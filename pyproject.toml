[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-sre-handson"
version = "0.1.0"
description = "常駐自律型 SRE エージェント ハンズオン実装（Cloud Run instances + sandboxes / GKE / BigQuery Vector Search / ADK 2.x / Slack Socket Mode）"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "google-adk[db,gcp,otel-gcp]>=2.13.0,<3.0.0",
    "mcp>=1.10.0",
    "google-genai>=2.30.1",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-pubsub>=2.23.0",
    "google-cloud-monitoring>=2.22.0",
    "google-cloud-logging>=3.11.0",
    "google-cloud-container>=2.50.0",
    "kubernetes>=30.1.0",
    "slack-bolt>=1.20.0",
    "aiohttp>=3.10.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "greenlet>=3.0.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "google-adk[eval]>=2.13.0,<3.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
hardening = [
    "google-cloud-modelarmor>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["sre-agent/agent_app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["sre-agent", "target-app", "appendix/production-hardening"]
