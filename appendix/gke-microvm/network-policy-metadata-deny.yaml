# ============================================================================
# 付録: GKE Sandbox (microVM) 用の NetworkPolicy（着信完全遮断 + 最小 Egress 制限）
# 公式セキュリティ推奨事項:
#   - SRE エージェントは外向き通信（Pub/Sub Pull & Slack Socket Mode）のみで動作するため、
#     Ingress（着信）は全面拒否とします。
#   - エージェント本体は Workload Identity で GCP API へ認証するため、DNS (53)、HTTPS (443)、および
#     Workload Identity メタデータエンドポイント（Dataplane V2 では 169.254.169.254:80、従来構成では
#     169.254.169.252:988）のみを許可します。
#   - 未信頼コードを別 Pod で分離実行するワーカー Pod の場合は、下記 169.254.169.254/32 と
#     169.254.169.252/32 の許可ブロックを削除することでメタデータ到達を完全遮断できます。
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sre-agent-microvm-netpol
  namespace: sre-agent-system
spec:
  podSelector:
    matchLabels:
      app: sre-autonomous-agent
  policyTypes:
    - Ingress
    - Egress
  # 着信通信は一切許可しない（空配列 = Default Deny Ingress）
  ingress: []
  egress:
    # クラスタ内部 DNS (kube-dns / NodeLocal DNSCache) への名前解決を許可
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 外向き HTTPS (443) 通信のみ許可（メタデータ IP への 443 等は除外）
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
              - 169.254.169.252/32
      ports:
        - protocol: TCP
          port: 443
    # Workload Identity トークン取得用エンドポイント（Dataplane V2: 169.254.169.254:80 / 標準: 169.254.169.252:988）
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - protocol: TCP
          port: 988
